# Made with love by Vibey, the auto-vibecoding machine by Adam Matthew Steinberger.
name: Merge train (develop)

# Weekly: review every open pull request into `develop` and merge the ones that are ready.
#
# "Review" here is a mechanical gate, not a judgement of the code — code review is the
# `copilot_code_review` rule on the branch, and a human's job. This decides only whether a
# pull request is *ready*: not a draft, no conflicts, checks green, and nobody has asked
# for changes. Anything failing a gate is skipped with the reason recorded, never forced.
#
# Runs at 07:17 on Mondays, an hour after the currency audit at 06:17, so an audit that
# opens a pull request is picked up by the same morning's train. `Promote to main` then
# runs an hour later still.
#
# Squash-merge, because `develop`'s ruleset sets allowed_merge_methods: ["squash"] — a
# feature branch arrives on develop as one commit.
#
# NOTE ON PERMISSIONS. develop's ruleset requires an approving review and GitHub Actions
# is not among its bypass actors, so the default GITHUB_TOKEN cannot merge. Supply a
# repository secret `AUTOMERGE_TOKEN` (a token belonging to someone with the admin role),
# or add GitHub Actions to the ruleset's bypass actors. Without one of those this job
# reports every pull request as blocked rather than merging anything.

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be merged without merging it"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-train-develop
  cancel-in-progress: false

jobs:
  merge:
    name: Merge ready pull requests into develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review and merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --base develop --state open --json number \
                  --jq 'sort_by(.number) | .[].number')
          if [ -z "${prs}" ]; then
            echo "::notice::no open pull requests into develop."
            echo "No open pull requests into \`develop\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Merge train — develop"
            echo
            echo "| PR | Title | Outcome |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          merged=0
          skipped=0
          for pr in ${prs}; do
            # Re-read each time: merging one pull request can invalidate the next.
            data=$(gh pr view "${pr}" --json number,title,isDraft,mergeable,reviewDecision,statusCheckRollup)
            title=$(jq -r '.title' <<<"${data}" | tr '|' '/')
            draft=$(jq -r '.isDraft' <<<"${data}")
            mergeable=$(jq -r '.mergeable' <<<"${data}")
            review=$(jq -r '.reviewDecision // ""' <<<"${data}")
            failing=$(jq -r '[.statusCheckRollup[]? | select(.conclusion != null)
                              | select(.conclusion != "SUCCESS" and .conclusion != "NEUTRAL"
                                       and .conclusion != "SKIPPED")] | length' <<<"${data}")
            pending=$(jq -r '[.statusCheckRollup[]? | select(.status != null and .status != "COMPLETED")] | length' <<<"${data}")

            reason=""
            if [ "${draft}" = "true" ]; then reason="draft"
            elif [ "${mergeable}" = "CONFLICTING" ]; then reason="conflicts with develop"
            elif [ "${review}" = "CHANGES_REQUESTED" ]; then reason="changes requested"
            elif [ "${pending}" != "0" ]; then reason="${pending} check(s) still running"
            elif [ "${failing}" != "0" ]; then reason="${failing} check(s) failing"
            fi

            if [ -n "${reason}" ]; then
              echo "::warning::#${pr} skipped — ${reason}"
              echo "| #${pr} | ${title} | skipped — ${reason} |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              echo "| #${pr} | ${title} | would squash-merge |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Plain merge first. It is refused while the ruleset's approving-review
            # requirement is unmet — "the base branch policy prohibits the merge" — even
            # for a token whose owner is an admin, because bypassing is opt-in per call.
            # So fall back to --admin, which succeeds only if the token actually carries
            # the admin role. That fallback deliberately bypasses the review requirement:
            # it is the only way an unattended train can merge under these rulesets, and
            # the readiness gate above is what stands in for the review.
            if gh pr merge "${pr}" --squash --delete-branch 2>/dev/null; then
              echo "::notice::#${pr} squash-merged into develop"
              echo "| #${pr} | ${title} | squash-merged |" >> "$GITHUB_STEP_SUMMARY"
              merged=$((merged + 1))
            elif gh pr merge "${pr}" --squash --delete-branch --admin; then
              echo "::notice::#${pr} squash-merged into develop (review requirement bypassed)"
              echo "| #${pr} | ${title} | squash-merged (bypassed review) |" >> "$GITHUB_STEP_SUMMARY"
              merged=$((merged + 1))
            else
              echo "::warning::#${pr} could not be merged. The token cannot satisfy or bypass develop's ruleset — see the permissions note in this workflow."
              echo "| #${pr} | ${title} | blocked by ruleset |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
            fi
          done

          {
            echo
            echo "Merged ${merged}, skipped ${skipped}."
          } >> "$GITHUB_STEP_SUMMARY"
