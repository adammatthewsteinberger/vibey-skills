name: Release

# Every push to `develop` publishes to TestPyPI; every push to `main` publishes to PyPI.
#
# An index version is immutable, so "every push publishes" cannot mean re-uploading the
# same version:
#
#   develop — builds `<release>.dev<run_number>` (see tools/dev_version.py). Distinct per
#             push, PEP 440 valid, and sorts before the release it anticipates.
#   main    — publishes the exact version in src/vibey_skills/__init__.py. Most pushes to
#             main carry no version bump, so the publish steps skip an existing version
#             instead of failing the run.
#
# A `v*` tag still works and additionally attaches the artifacts to a GitHub Release.
on:
  push:
    branches: [develop, main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Serialise publishes per ref. Never cancel one midway: a cancelled run can leave a
  # version uploaded to one index and not the other.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_pypi: ${{ steps.version.outputs.publish_pypi }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Runs on the clean tree, before any version patching below.
      - name: Validate marketplace manifests and skill frontmatter
        run: python3 tools/validate_manifests.py

      - name: Resolve the version to publish
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            version=$(python3 tools/dev_version.py --build "${GITHUB_RUN_NUMBER}" --apply)
            publish_pypi=false
            echo "develop build — TestPyPI only, as ${version}"
          else
            version=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/vibey_skills/__init__.py').read_text()).group(1))")
            publish_pypi=true
            echo "release build — TestPyPI then PyPI, as ${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish_pypi=${publish_pypi}" >> "$GITHUB_OUTPUT"

      # dev_version.py patches both version sites, so the tree still validates.
      - name: Re-validate after version patching
        run: python3 tools/validate_manifests.py

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/vibey_skills/__init__.py').read_text()).group(1))")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # TestPyPI first, and PyPI only if it succeeds. A PyPI version number is immutable — it
  # can never be reused, even after a yank — so the one chance to catch a bad artifact is
  # before it lands. TestPyPI is a separate instance with its own account and its own
  # trusted publisher; configure one there for this project or this job will fail.
  #
  # `skip-existing` because TestPyPI may already hold a version from a re-run of the same
  # tag; that should not block the real publish.
  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vibey-skills
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Proves the uploaded artifact actually installs and runs — FROM TESTPYPI — before the
  # irreversible upload.
  #
  # TestPyPI is the only index configured here. An earlier version also passed
  # `--extra-index-url https://pypi.org/simple/`, which was a real hole: this package has zero
  # runtime dependencies, so the extra index bought nothing, but it meant pip could satisfy
  # this check from the production index instead — so a re-run, or any tag whose version
  # already existed on PyPI, would "verify" an artifact TestPyPI never received and the gate
  # would pass without testing anything. With a single index that is structurally impossible,
  # and the report check below asserts the provenance rather than assuming it.
  #
  # If a runtime dependency is ever added and is not mirrored on TestPyPI, this job will fail
  # to resolve. That is the intended outcome: decide consciously then, rather than reaching
  # back to PyPI by default and quietly losing the guarantee.
  verify-testpypi:
    name: Verify the TestPyPI artifact
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from TestPyPI and smoke-test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          index="https://test.pypi.org/simple/"
          spec="vibey-skills==${version}"

          # TestPyPI's index can lag its own upload by a few seconds.
          installed=0
          # TestPyPI's index has lagged its own upload by several minutes; allow ~5.
          for attempt in $(seq 1 15); do
            if pip install --quiet --index-url "$index" "$spec"; then
              installed=1
              break
            fi
            echo "not indexed yet; retrying in 20s (attempt ${attempt}/15)"
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install ${spec} from TestPyPI after 15 attempts (~5 min)"
            exit 1
          fi

          # Assert provenance instead of assuming it. Checking for the ABSENCE of the
          # production hosts is more durable than matching TestPyPI's CDN hostname, which is
          # free to change; production's is the thing that must never appear.
          pip install --dry-run --quiet --ignore-installed \
            --report /tmp/resolve.json --index-url "$index" "$spec"
          urls=$(jq -r '.install[].download_info.url' /tmp/resolve.json)
          echo "resolved from:"; printf '%s\n' "$urls" | sed 's/^/  /'
          # Fail closed. An empty list would otherwise sail through the grep below and report
          # success while having verified nothing — the same shape of bug as the check this
          # step replaced, so it gets an explicit assertion rather than trust in `set -e`.
          if [ -z "$urls" ]; then
            echo "::error::resolution report listed no downloads; cannot verify provenance"
            exit 1
          fi
          if printf '%s\n' "$urls" | grep -qE '//(files\.pythonhosted\.org|pypi\.org)/'; then
            echo "::error::resolved from the production index, not TestPyPI"
            exit 1
          fi

          vibey-skills --version
          vibey-skills list > /dev/null
          vibey-skills install --all --dest /tmp/verify-skills
          expected=$(find plugins -name SKILL.md | wc -l | tr -d ' ')
          actual=$(find /tmp/verify-skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "skills expected ${expected} / installed ${actual}"
          test "$expected" = "$actual"

  # Only main and tags reach production. `skip-existing` because most pushes to main
  # carry no version bump — a workflow or docs change re-runs this job with a version
  # PyPI already holds, and that must be a no-op rather than a red build.
  pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi]
    if: needs.build.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vibey-skills
    permissions:
      # Trusted Publishing (OIDC): the workflow mints a short-lived token from PyPI.
      # No API token is stored in this repository or in any secret.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Attach artifacts to the GitHub Release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true

  # The gitflow fix.
  #
  # A `develop -> main` pull request leaves exactly one commit on main that develop does
  # not have: the merge commit itself. GitHub's merge button has no fast-forward option,
  # so a long-lived develop is permanently one commit behind after every release — which
  # is why each following PR reported "head branch is not up to date" and needed a manual
  # back-merge. develop's tip is always an ancestor of that merge commit, so develop can
  # be fast-forwarded onto main instead: no merge, no new commit, nothing to resolve.
  #
  # Runs after the PyPI publish so a failed release does not move develop. If someone
  # pushed to develop in between, the fast-forward is not possible and the job says so
  # rather than forcing anything.
  sync-develop:
    name: Fast-forward develop to main
    needs: pypi
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward develop to main
        run: |
          set -euo pipefail
          git fetch --quiet origin main develop
          if ! git merge-base --is-ancestor origin/develop origin/main; then
            echo "::warning::develop has commits main does not, so it cannot be fast-forwarded. Open a develop -> main pull request for them."
            exit 0
          fi
          if [ "$(git rev-parse origin/develop)" = "$(git rev-parse origin/main)" ]; then
            echo "::notice::develop already matches main; nothing to do."
            exit 0
          fi
          if git push origin origin/main:refs/heads/develop; then
            echo "::notice::develop fast-forwarded to main."
          else
            echo "::warning::could not push to develop — a ruleset may be blocking it. Fast-forward it manually: git push origin main:develop"
          fi

