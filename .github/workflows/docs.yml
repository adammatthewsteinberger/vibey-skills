name: Docs

# Deploys the documentation site to GitHub Pages at
# https://theviziusgroup.github.io/vibe-engineering-skills/
#
# Triggered by changes to the docs themselves AND to plugins/** — the skills reference is
# generated from that tree by docs/gen_reference.py, so a skill edit changes the site even
# though nothing under docs/ was touched.
#
# No `github.event.*` value is interpolated anywhere below, so there is no workflow-injection
# surface here; keep it that way if this file grows.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "plugins/**"
      - ".claude-plugin/marketplace.json"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise Pages deploys, but never cancel one midway — a cancelled deploy can leave the
# site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Check documentation links
        run: python3 tools/check_links.py

      - name: Build (strict — any warning, including a broken link, fails)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
