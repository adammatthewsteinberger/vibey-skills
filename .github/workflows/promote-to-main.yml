name: Promote develop to main

# Weekly: if `develop` has anything `main` does not, open the promotion pull request and
# rebase-merge it. Merging to main publishes to PyPI (see release.yml), so this is the
# release train — it runs at 08:17 on Mondays, an hour after the develop merge train, so
# the week's pull requests are already in.
#
# The comparison is by CONTENT, not by commit count. develop -> main is rebase-merged, so
# main's commits are rewritten copies with different SHAs; develop will always look
# "ahead" by some number of commits even when the two trees are identical. `git diff`
# between the branches is the only honest test of whether there is anything to release.
#
# Rebase, because main's ruleset sets allowed_merge_methods: ["rebase"] — which is also
# the only method consistent with the required_linear_history rule both rulesets enforce.
# A merge commit would violate it, which is why merges to main used to need an admin
# bypass. Every commit from develop is preserved, replayed onto the front of main.
#
# NOTE ON PERMISSIONS. main's ruleset requires an approving review and GitHub Actions is
# not among its bypass actors, so the default GITHUB_TOKEN cannot merge. Supply a
# repository secret `AUTOMERGE_TOKEN` (a token belonging to someone with the admin role),
# or add GitHub Actions to the ruleset's bypass actors. Without one of those this job
# opens the pull request and reports that it could not merge it, which is a safe place to
# stop — the release simply waits for a human.

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be promoted without opening or merging anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote develop to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main develop

          if git diff --quiet origin/main origin/develop; then
            echo "::notice::develop and main have identical trees; nothing to promote."
            echo "Nothing to promote — \`develop\` and \`main\` are identical." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only origin/main origin/develop | wc -l | tr -d ' ')
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/vibey_skills/__init__.py').read_text()).group(1))")
          echo "::notice::${changed} file(s) differ; package version is ${version}"

          {
            echo "## Promote develop to main"
            echo
            echo "- Files differing: ${changed}"
            echo "- Package version: \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "- Dry run: stopping before opening the pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // ""')
          if [ -z "${pr}" ]; then
            pr=$(gh pr create --base main --head develop \
                   --title "Promote develop to main ($(date -u +%Y-%m-%d))" \
                   --body "$(printf '%s\n' \
                     "Weekly promotion opened by \`Promote develop to main\`." \
                     "" \
                     "${changed} file(s) differ from \`main\`. Package version is \`${version}\` — merging publishes to PyPI, and skips if that version is already there, so bump it first if this release is meant to be installable." \
                     "" \
                     "Rebase-merged, per main's ruleset: every commit from \`develop\` is preserved and replayed onto the front of main's history." )" \
                   | tr -dc '0-9')
            echo "::notice::opened pull request #${pr}"
            echo "- Opened #${pr}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::reusing open pull request #${pr}"
            echo "- Reusing #${pr}" >> "$GITHUB_STEP_SUMMARY"
          fi

          # A pull request opened seconds ago has no results yet. Wait for the checks
          # rather than merging blind; --watch exits non-zero if any of them fail.
          if ! timeout 1800 gh pr checks "${pr}" --watch --interval 30; then
            echo "::warning::checks did not pass on #${pr}; leaving it open."
            echo "- Checks did not pass — left open for review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh pr merge "${pr}" --rebase; then
            echo "::notice::#${pr} rebase-merged into main; release.yml will publish to PyPI."
            echo "- Rebase-merged. \`release.yml\` publishes to PyPI and realigns develop." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not merge #${pr} — main's ruleset most likely refused it. See the permissions note in this workflow."
            echo "- Blocked by ruleset — left open for a human to merge." >> "$GITHUB_STEP_SUMMARY"
          fi
