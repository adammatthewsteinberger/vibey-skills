# vibey-gh configuration for this marketplace.
#
# The tooling that used to live in tools/check_fingerprints.py, tools/next_version.py and
# tools/dev_version.py is now the `vibey-gh` package. Same rules, one implementation, so
# a fix reaches every repository that uses it rather than one copy of it.
#
# `fingerprint.text` and `fingerprint.trailer` are left at their defaults. Pin the exact
# `vibey-gh` version everywhere it is installed (workflows, [dev] extra) rather than relying
# on this — a floating specifier lets the defaults drift out from under this repository
# with no warning, which is exactly what broke CI between 1.2.0 and 1.16.0.

[fingerprint]
# Files that CAN carry a header comment. Deliberately not plugins/**/*.md — those are the
# product, verified byte-for-byte against the documents they were split from, and a header
# would be both context noise and a diff against the source. The commit trailer covers
# them instead, which is the whole reason the rule has two halves.
sources = [
  "tools/*.py",
  "src/**/*.py",
  "docs/*.py",
  ".github/workflows/*.yml",
]

[version]
# BOTH sites, and they must never disagree: the CLI reports one and Claude Code reads the
# other. The validator fails the build if they differ.
files         = ["src/vibey_skills/__init__.py", ".claude-plugin/marketplace.json"]
# The skills and the manifest are the product — a change here is what users receive.
content_paths = ["plugins/", ".claude-plugin/marketplace.json"]
# src/ alone is the packaging CLI: a fix, not new content. pyproject.toml counts with it
# — it declares the dependencies and force-includes plugins/ into the wheel, so a change
# there changes what an installed user gets. Left out, a dependency bump reads as "docs,
# workflows, tooling" and the promotion publishes nothing, silently. That is exactly what
# happened in vibey-bootstrap.
code_paths    = ["src/", "pyproject.toml"]

[install]
# The merge train, the promotion, and the templates that don't collide with anything this
# repository already owns. `provenance.yml` now duplicates and replaces ci.yml's own
# "Check fingerprints" step — both a required check named "Provenance" and the ruleset
# update land in the same change, so the check is never unenforced in between.
#
# Deliberately NOT installed:
#   api-drift.yml            — vibey-gh's own self-test; `pip install .` installs
#                               vibey-skills here, so the import it asserts always fails.
#   documentation.yml        — the documentation contract isn't satisfied yet.
#   pr-automation.yml, github-release.yml, release-repair.yml, repository-profile.yml
#                             — need config decisions made first (scan_workflows, profile
#                               description/topics, release.yml's own release job removed).
#   release-surfaces.yml     — would fight docs.yml for ownership of GitHub Pages.
#   codeql.yml                — needs CodeQL default setup switched off first.
workflows = [
  "merge-train.yml",
  "promote-to-main.yml",
  "provenance.yml",
  "branch-intake.yml",
  "conventional-commits.yml",
  "automation-bootstrap.yml",
]

[branches]
integration = "develop"
release     = "main"

[merge_train]
owner           = "adammatthewsteinberger"
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]

[documentation]
# Re-enabled in Stage 4, once the required files and README sections exist.
enabled = false
