# vibey-gh configuration for this marketplace.
#
# The tooling that used to live in tools/check_fingerprints.py, tools/next_version.py and
# tools/dev_version.py is now the `vibey-gh` package. Same rules, one implementation, so
# a fix reaches every repository that uses it rather than one copy of it.
#
# `fingerprint.text` and `fingerprint.trailer` are left at their defaults. Pin the exact
# `vibey-gh` version everywhere it is installed (workflows, [dev] extra) rather than relying
# on this — a floating specifier lets the defaults drift out from under this repository
# with no warning, which is exactly what broke CI between 1.2.0 and 1.16.0.

[fingerprint]
# Files that CAN carry a header comment. Deliberately not plugins/**/*.md — those are the
# product, verified byte-for-byte against the documents they were split from, and a header
# would be both context noise and a diff against the source. The commit trailer covers
# them instead, which is the whole reason the rule has two halves.
sources = [
  "tools/*.py",
  "src/**/*.py",
  "docs/*.py",
  ".github/workflows/*.yml",
]

[version]
# BOTH sites, and they must never disagree: the CLI reports one and Claude Code reads the
# other. The validator fails the build if they differ.
files         = ["src/vibey_skills/__init__.py", ".claude-plugin/marketplace.json"]
# The skills and the manifest are the product — a change here is what users receive.
content_paths = ["plugins/", ".claude-plugin/marketplace.json"]
# src/ alone is the packaging CLI: a fix, not new content. pyproject.toml counts with it
# — it declares the dependencies and force-includes plugins/ into the wheel, so a change
# there changes what an installed user gets. Left out, a dependency bump reads as "docs,
# workflows, tooling" and the promotion publishes nothing, silently. That is exactly what
# happened in vibey-bootstrap.
code_paths    = ["src/", "pyproject.toml"]

[install]
# The merge train, the promotion, and the templates that don't collide with anything this
# repository already owns. `provenance.yml` now duplicates and replaces ci.yml's own
# "Check fingerprints" step — both a required check named "Provenance" and the ruleset
# update land in the same change, so the check is never unenforced in between.
#
# Deliberately NOT installed, permanently, both for the same underlying reason — a
# template step that does `pip install .` (or an equivalent checkout-and-install of this
# repo's own default branch) expecting that to make `vibey-gh` itself importable/runnable.
# It never does here: this repo's runtime `dependencies` are deliberately `[]` (so `uvx
# vibey-skills` resolves nothing), so that install only ever yields `vibey-skills`.
#   api-drift.yml            — asserts vibey_gh.surfaces parity on whatever it installed;
#                               the import fails outright.
#   conventional-commits.yml — its "Check out trusted normalizer" step installs this
#                               repo's default branch into `automation/`, then calls the
#                               `vibey-gh` CLI, which was never actually installed —
#                               confirmed failing on PR #48 with "vibey-gh: command not
#                               found" inside the msg-filter. Not a required check, so it
#                               was silent rather than blocking, which is worse: it can
#                               never actually normalize anything.
#
# Deliberately NOT installed for other reasons:
#   release-surfaces.yml     — would fight docs.yml for ownership of GitHub Pages.
#   release-repair.yml       — watches for failures of "GitHub Release" among others and
#                               spends an AI call diagnosing each one. Since
#                               github-release.yml (below) is expected to fail on most
#                               pushes to main, adopting this too would mean repeatedly
#                               "repairing" a failure that isn't one.
#
# codeql.yml runs "Analyze Python" only (CodeQL default setup, now switched off, also
# scanned the "actions" language — that coverage is gone until vibey-gh's template adds
# it). Both rulesets' required check was updated from "Analyze (python)" to
# "Analyze Python" in the same change that installed this workflow.
#
# pr-automation.yml is configured below in [pr_automation]. "PR automation / gate" is a
# required check on both rulesets.
#
# github-release.yml is installed KNOWING it will fail on most pushes to main. It fires
# on every completed `Release` run on main with no way to skip a push that carries no
# version bump — and most of this repository's own promotions are exactly that (docs- or
# tooling-only, per [version] above). `vibey_gh.github_release.publish()` raises
# "refusing to move existing tag" whenever the version file is unchanged, because the tag
# for that version already exists at an earlier SHA. There is no config knob for this,
# and no way to guard it from this side of the trigger — a workflow run's overall
# `conclusion` is `success` once any job in it succeeds, so nothing this repository's own
# `Release` workflow does can make `github-release.yml`'s `workflow_run` trigger see
# anything other than `success`. Filed upstream; accepted here as a known, expected,
# non-blocking failure (it is not a required check) rather than declined outright,
# because release.yml's own "github-release" job — kept, unchanged, tag-push-triggered —
# already creates the tag and attaches build artifacts correctly regardless of whether
# this one succeeds. `.github/workflows/release-artifacts.yml` (hand-authored, not
# vibey-gh-managed) attaches those same artifacts to whatever release github-release.yml
# creates on an actual bump, and exits cleanly rather than failing when none appears.
workflows = [
  "merge-train.yml",
  "promote-to-main.yml",
  "provenance.yml",
  "branch-intake.yml",
  "automation-bootstrap.yml",
  "codeql.yml",
  "pr-automation.yml",
  "github-release.yml",
  "repository-profile.yml",
]

[pr_automation]
# This repository's real workflow names. The default also names "API drift (Cloud Agents
# OpenAPI)", which is vibey-gh's own self-test and is deliberately not installed here —
# left in, the gate would wait forever on a workflow that never runs.
scan_workflows = ["CI", "Provenance", "CodeQL", "Docs"]

[repository_profile]
description = "Agent Skills for vibe engineering — 644 evidence-grounded practitioner references as a Claude Code plugin marketplace"
topics = [
  "claude-code",
  "agent-skills",
  "plugin-marketplace",
  "prompt-engineering",
  "developer-tools",
]
# develop is the head of the promotion PR into main; auto-deleting it on merge would
# delete the very branch the next promotion needs to exist.
delete_branch_on_merge = false

[branches]
integration = "develop"
release     = "main"

[merge_train]
owner           = "adammatthewsteinberger"
trusted_authors = ["adammatthewsteinberger", "claude[bot]", "github-actions[bot]", "vibey[bot]"]

[documentation]
enabled = true
